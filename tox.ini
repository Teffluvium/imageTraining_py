[tox]
minversion = 3.9.0
envlist = py39, py312, ruff, ruff-format, mypy
isolated_build = true

[gh-actions]
python =
    3.9: py39
    3.12: py312, mypy, ruff, ruff-format

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}

[testenv:ruff]
basepython = python3.12
deps = ruff
commands = ruff check src tests

[testenv:ruff-format]
basepython = python3.12
deps = ruff
commands = ruff format --check src tests

[testenv:mypy]
basepython = python3.12
deps =
    -r{toxinidir}/requirements_dev.txt
commands = mypy src
